[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Generous timeout: model download on first request can take a few minutes.
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
startCommand = "/app/start.sh"

# Required env vars (set via `railway variables --set`):
#   FACEFUSION_API_TOKEN — bearer token shared with the Supabase edge function.
# Optional:
#   ALLOWED_ORIGINS  — CSV of frontend origins (default "*", set in prod).
#   FACEFUSION_TIMEOUT_S — per-request timeout (default 180s).
#   FACEFUSION_EXECUTION_PROVIDERS — "cuda" on GPU, "cpu" otherwise.
